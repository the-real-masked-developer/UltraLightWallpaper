name: Windows build and unit tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Restore locked dependencies
        run: dotnet restore UltraLightWallpaper.slnx --locked-mode
      - name: Compile solution
        run: dotnet build UltraLightWallpaper.slnx -c Release --no-restore
      - name: Run unit tests
        run: dotnet test tests/UltraLightWallpaper.Tests -c Release --no-build --verbosity normal
